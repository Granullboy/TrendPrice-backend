server:
  port: 0
  forward-headers-strategy: framework

spring:
  application:
    name: purchase-service
  datasource:
    url: jdbc:postgresql://localhost:5432/purchase_service
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
