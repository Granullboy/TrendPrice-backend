services:
  postgres:
    container_name: trendprice-postgres
    image: postgres:16.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  eureka:
    container_name: trendprice-eureka
    build:
      context: ./eureka-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
    ports:
      - "8761:8761"

  apigateway:
    container_name: trendprice-apigateway
    build:
      context: ./apigateway-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8762:8762"
    depends_on:
      - eureka

  user-service:
    container_name: trendprice-user-service
    build:
      context: ./user-service
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service
    depends_on:
      - postgres
      - eureka

  price-service:
    container_name: trendprice-price-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/price_service
    depends_on:
      - postgres
      - eureka

  product-service:
    container_name: trendprice-product-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_service
    depends_on:
      - postgres
      - eureka

  store-service:
    container_name: trendprice-store-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/store_service
    depends_on:
      - postgres
      - eureka

  parser-service:
    container_name: trendprice-parser-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/parser_service
    depends_on:
      - postgres
      - eureka
      - price-service
      - product-service
      - store-service

  receipt-service:
    container_name: trendprice-receipt-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/receipt_service
    depends_on:
      - postgres
      - eureka
      - price-service
      - product-service
      - store-service

  catalog-service:
    container_name: trendprice-catalog-service
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: compose
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka
      - price-service
      - product-service
      - store-service

volumes:
  pgdata: