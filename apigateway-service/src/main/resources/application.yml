server:
  port: 8762
  forward-headers-strategy: framework
  ssl:
    bundle: gateway

spring:
  application:
    name: apigateway-service

  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              strip-prefix: true
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - Authorization
                  - Content-Disposition
                allow-credentials: true

  ssl:
    bundle:
      jks:
        gateway:
          key:
            alias: application
          keystore:
            location: classpath:application.p12
            password: 123456
            type: PKCS12

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

springdoc:
  swagger-ui:
    path: /
    urls:
      - name: product-service
        url: /product-service/v3/api-docs
      - name: store-service
        url: /store-service/v3/api-docs
      - name: price-service
        url: /price-service/v3/api-docs
      - name: catalog-service
        url: /catalog-service/v3/api-docs
    urls-primary-name: catalog-service