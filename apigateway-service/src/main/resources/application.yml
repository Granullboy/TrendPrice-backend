server:
  port: 8762

spring:
  application:
    name: apigateway-service

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Disposition
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          strip-prefix: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: product-service
        url: /product-service/v3/api-docs
      - name: store-service
        url: /store-service/v3/api-docs
      - name: price-service
        url: /price-service/v3/api-docs
    urls-primary-name: product-service